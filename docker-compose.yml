services:

  mysql:
    image: mysql:8.0
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wt
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - employee-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8181"
    networks:
      - employee-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: employee-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://employee-backend:8181
    ports:
      - "4200:80"
    networks:
      - employee-net

volumes:
  mysql_data:

networks:
  employee-net:
    driver: bridge
